<style>
:root{
  --paper:#FAF9FC; --paper2:#EFEEF6; --card:#FFFFFF;
  --ink:#1E1B2E; --ink2:#5D5872; --ink3:#918CA6;
  --rule:#CBCBE0; --ruleS:#8888B8;
  --seal:#B5397A; --indigo:#4A3C8C;
  --ok:#4A7D6E; --warn:#B8860B; --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#15131F;--paper2:#201D2E;--card:#262234;--ink:#E9E7F0;--ink2:#A5A0B8;--ink3:#726D85;
    --rule:#3A3550;--ruleS:#6E68A0;--seal:#E0699F;--indigo:#A99CE8;--ok:#7FC9AE;--warn:#D6A93A;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:84px}
.kr{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:600px;margin:0 auto;padding:18px 16px 0}
h1{font-size:19px;font-weight:600;margin:0 0 2px;letter-spacing:.02em}
h2{font-size:15px;font-weight:600;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.sub{font-size:13px;color:var(--ink2);margin:0 0 18px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

.genko{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:10px;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--r)}
.genko i{aspect-ratio:1;border:1px solid var(--rule);border-radius:2px;display:block;transition:background .25s}
.genko i.f{background:var(--ruleS);border-color:var(--ruleS)}
.genko i.n{background:var(--seal);border-color:var(--seal)}
.stat{display:flex;gap:20px;margin:14px 0 4px;align-items:baseline}
.stat b{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2);display:block;margin-top:-4px}
.cta{display:block;width:100%;padding:15px;background:var(--indigo);color:#fff;border-radius:var(--r);
  font-size:16px;font-weight:600;margin:18px 0 6px;text-align:center}
.cta.done{background:var(--paper2);color:var(--ink2)}
.cta2{display:block;width:100%;padding:12px;border:1px solid var(--rule);border-radius:var(--r);
  font-size:14px;margin:8px 0;background:var(--card);text-align:center}

.study{padding:16px;max-width:600px;margin:0 auto}
.qbar{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:14px}
.face{background:var(--card);border:1px solid var(--rule);border-radius:14px;min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px 26px;
  text-align:center;position:relative}
.face .tag{position:absolute;top:10px;left:14px;font-size:11px;color:var(--ink3)}
.big{font-size:76px;line-height:1.1}
.mid{font-size:28px;line-height:1.4;font-weight:500}
.small{font-size:18px;line-height:1.6}
.ans{border-top:1px dashed var(--rule);margin-top:18px;padding-top:16px;width:100%}
.romaji{font-size:22px;color:var(--indigo);letter-spacing:.06em;font-weight:600}
.hint{font-size:13px;color:var(--ink2);margin-top:8px}
.spk{margin-top:14px;padding:7px 16px;border:1px solid var(--rule);border-radius:99px;
  font-size:13px;color:var(--ink2);background:var(--paper)}
.tip{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:12px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}
.opts button{padding:14px 12px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--card);font-size:16px;text-align:center}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{border-color:var(--seal);color:var(--seal)}
.opts button.dim{opacity:.4}
.grades{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.grades button{padding:14px 4px;border-radius:var(--r);font-size:14px;font-weight:600;border:1px solid var(--rule)}
.g0{background:var(--card);color:var(--seal)}
.g1{background:var(--card);color:var(--warn)}
.g2{background:var(--ok);color:#fff;border-color:var(--ok)}
.reveal{margin-top:14px;padding:15px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--rule);width:100%;font-weight:600;text-align:center}

.kt{display:grid;gap:4px}
.kt div{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:7px 2px;text-align:center;line-height:1.25}
.kt div.mix{border-color:var(--seal);border-width:1.5px}
.kt b{font-size:21px;font-weight:400;display:block}
.kt s{font-size:11px;color:var(--ink3);text-decoration:none;display:block}
.kt em{font-size:10px;color:var(--indigo);font-style:normal;display:block;letter-spacing:.04em}

.row{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px;
  margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%}
.row .l{min-width:0;flex:1}
.row .t{font-size:16px;font-weight:500}
.row .d{font-size:12px;color:var(--ink2);margin-top:1px}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--paper2);color:var(--ink2);
  white-space:nowrap;flex-shrink:0}
.pill.on{background:var(--ok);color:#fff}
.pill.mid{background:var(--warn);color:#fff}
.pill.nx{background:var(--indigo);color:#fff}

.gcard{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:10px}
.gcard .p{font-size:18px;font-weight:600;margin-bottom:5px}
.gcard .n{font-size:13px;color:var(--ink2);margin-bottom:10px}
.gcard .e{border-left:2px solid var(--ruleS);padding-left:11px;margin-top:9px;font-size:14px}
.gcard .e i{display:block;font-style:normal;color:var(--ink2);font-size:12.5px;margin-top:2px}

.unit{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.uhead{display:flex;align-items:center;gap:10px;padding:11px 13px;width:100%;text-align:left}
.uno{font-size:12px;color:var(--indigo);font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;min-width:30px}
.utitle{flex:1;font-size:15px;min-width:0}
.chk{width:22px;height:22px;border:1.5px solid var(--rule);border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;background:var(--paper)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ubody{padding:0 13px 12px;border-top:1px solid var(--paper2)}
.pat{font-size:13px;color:var(--ink2);padding:10px 0;border-bottom:1px solid var(--paper2)}
.ph{padding:9px 0;border-bottom:1px solid var(--paper2)}
.ph:last-child{border:none}
.ph .z{font-size:12.5px;color:var(--ink2)}
.ph .j{font-size:16.5px;margin-top:1px}
.ph .k{font-size:12px;color:var(--indigo)}

.bars{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:14px}
.bar{margin-bottom:13px}.bar:last-child{margin:0}
.bar .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.bar .h span{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12px}
.track{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--ruleS);border-radius:99px;transition:width .4s}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--rule);
  display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;padding:11px 2px 9px;font-size:11px;color:var(--ink3);text-align:center;line-height:1.3}
nav button b{display:block;font-size:17px;font-weight:400;margin-bottom:1px;opacity:.55;letter-spacing:-.06em}
nav button b.two{font-size:15px}
nav button.on{color:var(--indigo);font-weight:600}
nav button.on b{opacity:1}
.empty{text-align:center;color:var(--ink2);font-size:14px;padding:44px 20px}
.road{display:grid;gap:8px;margin:10px 0 18px}
.stage{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px}
.stage .top{display:flex;align-items:center;gap:10px}
.stage .num{width:29px;height:29px;border-radius:50%;background:var(--paper2);color:var(--indigo);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.stage .st{font-size:14px;font-weight:600;flex:1}.stage .sd{font-size:11.5px;color:var(--ink2);margin-top:5px}
.stage .mini{height:5px;background:var(--paper2);border-radius:99px;overflow:hidden;margin-top:9px}
.stage .mini i{display:block;height:100%;background:var(--ok)}
.notice{padding:11px 13px;border-left:3px solid var(--indigo);background:var(--paper2);border-radius:0 var(--r) var(--r) 0;
  font-size:12.5px;color:var(--ink2);margin:10px 0}
.dialog{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:13px;margin-bottom:10px}
.bubble{padding:8px 10px;background:var(--paper2);border-radius:9px;margin-top:7px;font-size:14px}
.bubble.you{margin-left:20px;border-left:2px solid var(--indigo)}
.bubble.them{margin-right:20px;border-left:2px solid var(--seal)}
.answerInput{width:100%;padding:13px;border:1px solid var(--rule);border-radius:var(--r);background:var(--card);
  color:var(--ink);font:inherit;margin-top:12px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ============================================================
   한글 발음 변화 + 로마자 변환 엔진
   給完全零基礎的學習者：把「拼寫」轉成「實際發音」再轉成羅馬拼音
   ============================================================ */

const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];

const isHangul = c => c >= "\uAC00" && c <= "\uD7A3";
function decomp(c){
  if(!isHangul(c)) return null;
  const n = c.charCodeAt(0) - 0xAC00;
  return { cho: CHO[Math.floor(n/588)], jung: JUNG[Math.floor((n%588)/28)], jong: JONG[n%28] };
}
function comp(cho,jung,jong){
  const i = CHO.indexOf(cho), j = JUNG.indexOf(jung), k = JONG.indexOf(jong||"");
  if(i<0||j<0||k<0) return null;
  return String.fromCharCode(0xAC00 + i*588 + j*28 + k);
}

/* 겹받침 분해: [남는 받침, 다음 음절로 넘어가는 소리] */
const DOUBLE_JONG = {
  "ㄳ":["ㄱ","ㅅ"],"ㄵ":["ㄴ","ㅈ"],"ㄶ":["ㄴ","ㅎ"],"ㄺ":["ㄹ","ㄱ"],
  "ㄻ":["ㄹ","ㅁ"],"ㄼ":["ㄹ","ㅂ"],"ㄽ":["ㄹ","ㅅ"],"ㄾ":["ㄹ","ㅌ"],
  "ㄿ":["ㄹ","ㅍ"],"ㅀ":["ㄹ","ㅎ"],"ㅄ":["ㅂ","ㅅ"]
};
/* 받침의 실제 소리: 27개 → 7개(ㄱㄴㄷㄹㅁㅂㅇ) */
const JONG_SOUND = {
  "":"", "ㄱ":"ㄱ","ㄲ":"ㄱ","ㅋ":"ㄱ","ㄳ":"ㄱ","ㄺ":"ㄱ",
  "ㄴ":"ㄴ","ㄵ":"ㄴ","ㄶ":"ㄴ",
  "ㄷ":"ㄷ","ㅅ":"ㄷ","ㅆ":"ㄷ","ㅈ":"ㄷ","ㅊ":"ㄷ","ㅌ":"ㄷ","ㅎ":"ㄷ",
  "ㄹ":"ㄹ","ㄼ":"ㄹ","ㄽ":"ㄹ","ㄾ":"ㄹ","ㅀ":"ㄹ",
  "ㅁ":"ㅁ","ㄻ":"ㅁ",
  "ㅂ":"ㅂ","ㅍ":"ㅂ","ㅄ":"ㅂ","ㄿ":"ㅂ",
  "ㅇ":"ㅇ"
};
const NASAL = {"ㄱ":"ㅇ","ㄷ":"ㄴ","ㅂ":"ㅁ"};
const ASPIRATE = {"ㄱ":"ㅋ","ㄷ":"ㅌ","ㅂ":"ㅍ","ㅈ":"ㅊ"};
const TENSE = {"ㄱ":"ㄲ","ㄷ":"ㄸ","ㅂ":"ㅃ","ㅅ":"ㅆ","ㅈ":"ㅉ"};
/* 規則引擎難以由拼寫單獨判斷的高頻標準讀音 */
const SPECIAL_PRON = {
  "깻잎":["깬닙","ㄴ 첨가"],"색연필":["생년필","ㄴ 첨가・비음화"],
  "읽다":["익따","겹받침・경음화"],"읽어요":["일거요","겹받침・연음"],
  "많다":["만타","ㅎ 격음화"],"앉아요":["안자요","겹받침・연음"],
  "나의":["나에","의 발음"]
};

/* 한 어절(띄어쓰기 단위) 안에서 발음 변화 적용 */
function pronounceWord(word){
  if(SPECIAL_PRON[word])return {text:SPECIAL_PRON[word][0],notes:SPECIAL_PRON[word][1].split("・")};
  const notes = [];
  let syl = [...word].map(c => decomp(c) || {raw:c});
  for(let i=0;i<syl.length;i++){
    const a = syl[i], b = syl[i+1];
    if(a.raw || !b || b.raw) continue;

    /* 겹받침 분해 준비 */
    let jong = a.jong, carry = null;
    if(DOUBLE_JONG[jong]){ [jong, carry] = DOUBLE_JONG[jong]; }

    /* 1) ㅎ 탈락 / 격음화 */
    if((a.jong==="ㅎ"||a.jong==="ㄶ"||a.jong==="ㅀ")){
      if(b.cho==="ㅇ"){                      /* 좋아요 → 조아요, 싫어요 → 시러요 */
        if(a.jong==="ㅎ"){ a.jong=""; }
        else { b.cho = (a.jong==="ㄶ") ? "ㄴ" : "ㄹ"; a.jong=""; }
        notes.push("ㅎ 탈락");
        continue;
      }
      if(ASPIRATE[b.cho]){                   /* 좋다 → 조타 */
        b.cho = ASPIRATE[b.cho];
        a.jong = a.jong==="ㅎ" ? "" : (a.jong==="ㄶ"?"ㄴ":"ㄹ");
        notes.push("격음화");
        continue;
      }
    }
    if(b.cho==="ㅎ" && ASPIRATE[JONG_SOUND[a.jong]]){   /* 축하 → 추카, 닫히 → 다치 */
      b.cho = ASPIRATE[JONG_SOUND[a.jong]];
      a.jong = carry ? carry : "";
      notes.push("격음화");
      if(b.jung==="ㅣ"&&(b.cho==="ㅌ"||b.cho==="ㄷ")){
        b.cho = b.cho==="ㅌ" ? "ㅊ" : "ㅈ"; notes.push("구개음화");
      }
      continue;
    }

    /* 2) 구개음화 — ㄷㅌ + 이 (연음보다 먼저 판정해야 함) */
    if((a.jong==="ㄷ"||a.jong==="ㅌ") && b.cho==="ㅇ" && (b.jung==="ㅣ"||b.jung==="ㅕ")){
      b.cho = a.jong==="ㄷ" ? "ㅈ" : "ㅊ"; a.jong=""; notes.push("구개음화"); continue;
    }
    /* 3) 연음 — 받침이 뒤 음절 첫소리로 */
    /* ㅇ 받침은 연음되지 않는다: 명이요 → 명이요 (며이요 아님) */
    if(b.cho==="ㅇ" && a.jong && a.jong!=="ㅇ"){
      if(carry){ b.cho = (carry==="ㅅ") ? "ㅆ" : carry; a.jong = jong; }
      else { b.cho = (a.jong==="ㅅ"||a.jong==="ㅆ") ? a.jong : a.jong; a.jong = ""; }
      notes.push("연음");
      continue;
    }

    /* 3) 비음화 — ㄱㄷㅂ + ㄴㅁ */
    const snd = JONG_SOUND[a.jong];
    if(NASAL[snd] && (b.cho==="ㄴ"||b.cho==="ㅁ")){
      a.jong = NASAL[snd];
      notes.push("비음화");
      continue;
    }
    /* 4) ㄹ 비음화 — ㅁㅇ + ㄹ → ㄴ */
    if((snd==="ㅁ"||snd==="ㅇ") && b.cho==="ㄹ"){
      b.cho = "ㄴ"; notes.push("ㄹ의 비음화"); continue;
    }
    /* 5) 유음화 — ㄴ+ㄹ, ㄹ+ㄴ → ㄹㄹ */
    if(snd==="ㄴ" && b.cho==="ㄹ"){ a.jong="ㄹ"; notes.push("유음화"); continue; }
    if(snd==="ㄹ" && b.cho==="ㄴ"){ b.cho="ㄹ"; notes.push("유음화"); continue; }
    /* 6) 경음화 — ㄱㄷㅂ 받침 + ㄱㄷㅂㅅㅈ */
    if((snd==="ㄱ"||snd==="ㄷ"||snd==="ㅂ") && TENSE[b.cho]){
      b.cho = TENSE[b.cho]; a.jong = snd; notes.push("경음화"); continue;
    }
    /* 그 외: 받침을 대표음으로 */
    if(a.jong && JONG_SOUND[a.jong]!==a.jong){ a.jong = JONG_SOUND[a.jong]; }
  }
  /* 마지막 음절 받침도 대표음으로 */
  const last = syl[syl.length-1];
  if(last && !last.raw && last.jong && JONG_SOUND[last.jong]!==last.jong)
    last.jong = JONG_SOUND[last.jong];

  const out = syl.map(s => s.raw ? s.raw : (comp(s.cho,s.jung,s.jong) || "")).join("");
  return { text: out, notes: [...new Set(notes)] };
}

function pronounce(sentence){
  const parts = sentence.split(/(\s+)/);
  const notes = [];
  const text = parts.map(p=>{
    if(/^\s*$/.test(p)) return p;
    const r = pronounceWord(p);
    notes.push(...r.notes);
    return r.text;
  }).join("");
  return { text, notes:[...new Set(notes)] };
}

/* ---------- 로마자 (국어의 로마자 표기법) ---------- */
const R_CHO = {"ㄱ":"g","ㄲ":"kk","ㄴ":"n","ㄷ":"d","ㄸ":"tt","ㄹ":"r","ㅁ":"m","ㅂ":"b","ㅃ":"pp",
  "ㅅ":"s","ㅆ":"ss","ㅇ":"","ㅈ":"j","ㅉ":"jj","ㅊ":"ch","ㅋ":"k","ㅌ":"t","ㅍ":"p","ㅎ":"h"};
const R_JUNG = {"ㅏ":"a","ㅐ":"ae","ㅑ":"ya","ㅒ":"yae","ㅓ":"eo","ㅔ":"e","ㅕ":"yeo","ㅖ":"ye",
  "ㅗ":"o","ㅘ":"wa","ㅙ":"wae","ㅚ":"oe","ㅛ":"yo","ㅜ":"u","ㅝ":"wo","ㅞ":"we","ㅟ":"wi",
  "ㅠ":"yu","ㅡ":"eu","ㅢ":"ui","ㅣ":"i"};
const R_JONG = {"":"","ㄱ":"k","ㄴ":"n","ㄷ":"t","ㄹ":"l","ㅁ":"m","ㅂ":"p","ㅇ":"ng"};

function romanizeSpoken(spoken){
  const arr=[...spoken]; let out="";
  for(let i=0;i<arr.length;i++){
    const d=decomp(arr[i]);
    if(!d){ out+=arr[i]; continue; }
    const prev = i>0 ? decomp(arr[i-1]) : null;
    /* ㄹ 받침 뒤의 ㄹ 은 r 이 아니라 l */
    let cho = (d.cho==="ㄹ" && prev && prev.jong==="ㄹ") ? "l" : R_CHO[d.cho];
    out += cho + R_JUNG[d.jung] + (R_JONG[d.jong] ?? "");
  }
  /* 받침+된소리로 같은 글자가 3개 겹치면 2개로 (hakkkyo → hakkyo) */
  return out.replace(/([a-z])\1{2,}/g,"$1$1");
}
/* 표기 그대로가 아니라 「실제 소리」를 로마자로 */
function roman(sentence){
  return sentence.split(/(\s+)/).map(p=>{
    if(/^\s*$/.test(p)) return p;
    return romanizeSpoken(pronounceWord(p).text);
  }).join("");
}

const today=()=>new Date().toLocaleDateString("sv");
const dnum=s=>Math.floor(new Date(s+"T00:00:00").getTime()/864e5);
async function rawGet(k){
  if(CLOUD){try{const r=await CLOUD.get(k,false);if(r&&r.value)return r.value;}catch(e){}}
  if(LOCAL){try{const v=LOCAL.get(k);if(v)return v;}catch(e){}}
  return null;
}
async function rawSet(k,v){
  let c=false,l=false;
  if(CLOUD){try{await CLOUD.set(k,v,false);c=true;}catch(e){}}
  if(LOCAL){try{LOCAL.set(k,v);l=true;}catch(e){}}
  backend=c?(l?"雲端＋本機":"雲端"):(l?"瀏覽器本機":"");
  if(!c&&!l)throw new Error("沒有可用的儲存空間");
  return true;
}
async function load(){
  const raw=await rawGet(KEY);
  if(raw){try{S=Object.assign(S,JSON.parse(raw));loadedFrom=KEY;}catch(e){lastErr="資料損毀";}}
  else loadedFrom="第一次使用";
  if(!S.off)S.off={listen:1};
  if(typeof S.roma!=="boolean")S.roma=true;
  const t=today();
  if(S.day.d!==t){
    if(S.last){const g=dnum(t)-dnum(S.last);S.streak=g===1?S.streak+1:(g===0?S.streak:0);}
    S.day={d:t,newN:0,revN:0};
  }
}
let saveT;

  try{const b=JSON.stringify(S);await rawSet(KEY,b);

}

/* ============ 同步 ============ */
let SY={url:"",key:"",code:""},syncMsg="",syncBusy=false;
const SYKEY="kr:sync";
const INFRAME=(()=>{try{return window.top!==window.self;}catch(e){return true;}})();
function loadSync(){try{const v=LOCAL&&LOCAL.get(SYKEY);if(v)SY=Object.assign(SY,JSON.parse(v));}catch(e){}}
function saveSync(){try{LOCAL&&LOCAL.set(SYKEY,JSON.stringify(SY));}catch(e){}}
const syncOn=()=>!!(SY.url&&SY.key&&SY.code);
function newCode(){const cs="abcdefghijkmnpqrstuvwxyz23456789";let o="";
  const a=new Uint8Array(16);crypto.getRandomValues(a);
  for(let i=0;i<16;i++)o+=cs[a[i]%cs.length];return o;}
async function rpc(fn,body){
  const r=await fetch(SY.url.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{apikey:SY.key,Authorization:"Bearer "+SY.key,"Content-Type":"application/json"},
    body:JSON.stringify(body)});
  const t=await r.text();
  if(!r.ok)throw new Error("HTTP "+r.status+"　"+t.slice(0,110));
  return t?JSON.parse(t):null;
}
function netHint(e){
  const m=String((e&&e.message)||e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))
    return INFRAME?"跑在 iframe 沙箱裡，沙箱禁止連外部網站。部署到 GitHub Pages 才能同步"
                  :"連不上伺服器。檢查 URL，或 Supabase 專案可能被暫停";
  if(/HTTP 404/.test(m))return "函式不存在，supabase_setup.sql 還沒執行";
  if(/HTTP 401|403/.test(m))return "anon key 不對或權限沒給";
  return "";
}
function mergeState(a,b){
  const an=a.mtime||0,bn=b.mtime||0;
  const base=JSON.parse(JSON.stringify(an>=bn?a:b)),other=(an>=bn?b:a);
  const cards={},ids=new Set(Object.keys(a.cards||{}).concat(Object.keys(b.cards||{})));
  ids.forEach(id=>{const x=(a.cards||{})[id],y=(b.cards||{})[id];
    if(!x){cards[id]=y;return;} if(!y){cards[id]=x;return;}
    const tx=x.t||0,ty=y.t||0;
    cards[id]=tx>ty?x:(ty>tx?y:((x.reps||0)>=(y.reps||0)?x:y));});
  base.cards=cards;
  base.total=Math.max(a.total||0,b.total||0);
  base.streak=Math.max(a.streak||0,b.streak||0);
  base.mtime=Math.max(an,bn);
  return base;
}
async function syncNow(manual){
  if(!syncOn()||syncBusy)return;
  syncBusy=true;syncMsg="同步中…";if(manual&&!session)render();
  try{
    const rows=await rpc("jp_pull",{p_code:SY.code+"-kr"});
    const remote=(rows&&rows[0]&&rows[0].data)?rows[0].data:null;
    if(remote)S=mergeState(S,remote);
    S.mtime=Date.now();await flush();
    await rpc("jp_push",{p_code:SY.code+"-kr",p_data:S});
    S.syncedAt=new Date().toLocaleString("zh-TW",{hour12:false});
    syncMsg="同步完成　共 "+Object.keys(S.cards).length+" 張";await flush();
  }catch(e){const h=netHint(e);syncMsg="同步失敗："+String((e&&e.message)||e).slice(0,70)+(h?"\n\n"+h:"");}
  syncBusy=false;if(!session)render();
}

/* ============ SRS ============ */
const seen=id=>!!S.cards[id];
const isDue=id=>{const c=S.cards[id];return c&&dnum(today())>=c.due;};
const mastery=id=>{const c=S.cards[id];return !c?0:(c.ivl>=21?2:(c.ivl>=1?1:0));};
function grade(id,g){
  let c=S.cards[id]||{ivl:0,ease:2.5,reps:0,lapse:0,due:0};
  if(g===0){c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.lapse++;c.reps=0;}
  else if(g===1){c.ivl=c.reps===0?1:Math.max(1,Math.round(c.ivl*1.25));c.ease=Math.max(1.3,c.ease-.15);c.reps++;}
  else{c.ivl=c.reps===0?1:(c.reps===1?3:Math.round(c.ivl*c.ease));c.ease=Math.min(2.8,c.ease+.05);c.reps++;}
  c.due=dnum(today())+Math.max(0,c.ivl);c.t=Date.now();
  S.cards[id]=c;S.total++;S.last=today();S.mtime=Date.now();save();return g===0;
}
function buildQueue(){
  const due=DECKS.filter(c=>isDue(c.id));
  const fresh=DECKS.filter(c=>!seen(c.id)&&!S.off[c.deck]).slice(0,Math.max(0,S.newPerDay-S.day.newN));
  const q=due.concat(fresh);
  for(let i=q.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[q[i],q[j]]=[q[j],q[i]];}
  return q;
}

function render(){
  if(session)return drawStudy();
  app.innerHTML=({today:vToday,hangul:vHangul,pron:vPron,word:vWord,gram:vGram,talk:vTalk}[tab])();

function bind(){
  app.querySelectorAll("[data-say]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();say(e.dataset.say);});
  app.querySelectorAll("[data-slow]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();say(e.dataset.slow,0.4);});
  app.querySelectorAll("[data-start]").forEach(e=>e.onclick=()=>startSession(e.dataset.start));
  app.querySelectorAll("[data-type]").forEach(e=>e.onclick=()=>startTyping(e.dataset.type));
  app.querySelectorAll("[data-course]").forEach(e=>e.onclick=()=>startCourse(+e.dataset.course));
  app.querySelectorAll("[data-np]").forEach(e=>e.onchange=()=>{S.newPerDay=+e.value;save();render();});
  app.querySelectorAll("[data-rate]").forEach(e=>e.onchange=()=>{S.rate=+e.value;save();say("안녕하세요");render();});
  app.querySelectorAll("[data-roma]").forEach(e=>e.onclick=()=>{S.roma=!S.roma;save();render();});
  app.querySelectorAll("[data-off]").forEach(e=>e.onclick=()=>{const k=e.dataset.off;
    if(S.off[k])delete S.off[k];else S.off[k]=1;save();render();});
  app.querySelectorAll("[data-wm]").forEach(e=>e.onclick=()=>{wMode=e.dataset.wm;render();});
  app.querySelectorAll("[data-tm]").forEach(e=>e.onclick=()=>{tMode=e.dataset.tm;render();});
  app.querySelectorAll("[data-trip]").forEach(e=>e.onchange=()=>{S.trip=e.value;save();render();});
  app.querySelectorAll("[data-setopen]").forEach(e=>e.onclick=()=>{setOpen=!setOpen;render();});
  app.querySelectorAll("[data-sync]").forEach(e=>e.onclick=()=>{
    const a=e.dataset.sync;
    if(a==="gen"){const f=document.getElementById("sycode");if(f)f.value=newCode();return;}
    if(a==="save"){
      const u=(document.getElementById("syurl")||{}).value||"",k=(document.getElementById("sykey")||{}).value||"",
            c=(document.getElementById("sycode")||{}).value||"";
      if(!/^https:\/\/.+/.test(u.trim())){syncMsg="URL 要像 https://xxxx.supabase.co";render();return;}
      if(c.trim().length<12){syncMsg="同步碼至少 12 字";render();return;}
      SY={url:u.trim(),key:k.trim(),code:c.trim()};saveSync();syncMsg="";render();syncNow(true);return;}
    if(a==="off"){SY.code="";saveSync();syncMsg="已停用";render();return;}
    if(a==="now")syncNow(true);});
  app.querySelectorAll("[data-io]").forEach(e=>e.onclick=()=>{
    ioMode=ioMode===e.dataset.io?"":e.dataset.io;render();
    if(ioMode==="out"){S.exportedAt=today();save();
      const b=document.getElementById("iobox");if(b){b.focus();b.select();}}});
  const imp=document.getElementById("doimport");
  if(imp)imp.onclick=()=>{const b=document.getElementById("iobox");
    try{const o=JSON.parse(b.value.trim());if(!o||!o.cards)throw 0;
      S=Object.assign(S,o);ioMode="";save();render();alert("匯入完成："+Object.keys(S.cards).length+" 張");}
    catch(e){alert("匯入失敗，請確認貼上的是完整內容");}};
}

/* --- 學習 --- */
function shuf(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeOpts(c){
  if(c.opts&&c.opts.length>1)return shuf(c.opts.slice());
  const used=new Set([c.back]),pool=[];
  (BY[c.deck]||[]).forEach(x=>{if(!used.has(x.back)){used.add(x.back);pool.push(x.back);}});
  return shuf([c.back].concat(shuf(pool).slice(0,3)));
}
const TIP={jamo:"先唸出這個字母的音",batchim:"先想這個收尾音怎麼發",word:"先唸出韓文，再想意思",
  syllable:"先逐字拼，再連起來讀",contrast:"依序讀出三組聲音並比較送氣",number:"先想這個數字怎麼唸",
  gram:"想出正確的助詞或語尾",travel:"出聲把整句韓文講出來",dialogue:"先自己說，再預測對方回話",
  response:"只聽回答，判斷對方在說什麼",reading:"先讀全文，再回答問題",
  drama:"出聲把整句韓文講出來",busan:"先唸唸看",listen:"先聽，再想是什麼意思"};
function startCourse(i){
  const u=COURSE[i];if(!u)return;
  let q=courseCards(u.k).filter(c=>isDue(c.id)||!seen(c.id));
  if(!q.length)q=courseCards(u.k);
  q=shuf(q).slice(0,25);if(!q.length)return;
  session={q,i:0,n:q.length};shown=false;pick=null;curOpts=null;undoSnap=null;played=0;taught=false;render();
}
function startTyping(kind){
  let q=DECKS.filter(c=>c.deck===kind&&(isDue(c.id)||!seen(c.id)));
  if(!q.length)q=DECKS.filter(c=>c.deck===kind);
  q=shuf(q).slice(0,20);if(!q.length)return;
  session={q,i:0,n:q.length,typed:true};shown=false;pick=null;curOpts=null;undoSnap=null;played=0;taught=false;render();
}
function startSession(kind){
  let q;
  if(kind==="all")q=buildQueue();
  else{q=DECKS.filter(c=>c.deck===kind&&(isDue(c.id)||!seen(c.id)));
    if(!q.length)q=DECKS.filter(c=>c.deck===kind);
    q=shuf(q).slice(0,25);}
  if(!q||!q.length)return;
  session={q,i:0,n:q.length};shown=false;pick=null;curOpts=null;undoSnap=null;played=0;taught=false;render();
}
function answerBlock(c,isNew,pick){
  const norm=x=>String(x||"").toLowerCase().replace(/[\s.,!?。！？、'’]/g,"");
  const wrong=pick!==null&&norm(pick)!==norm(c.back)
    ? `<div class="hint" style="color:var(--seal)">你的答案：「${esc(pick)}」</div>`
    :(pick!==null?`<div class="hint" style="color:var(--ok)">拼寫正確</div>`:"");
  const audio=c.kr?`<div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
      <button class="spk" data-say="${esc(c.kr)}">▸ 聽發音</button>
      <button class="spk" data-slow="${esc(c.kr)}">▸ 更慢</button></div>`:"";
  const pr=c.kr?pronounce(c.kr):null, diff=pr&&pr.text!==c.kr;
  const soundNote=diff?`<div class="kr" style="font-size:19px;color:var(--seal);margin-top:4px">[${esc(pr.text)}]
      <span style="font-size:11px;color:var(--ink3)">　${pr.notes.join("・")}</span></div>`:"";
  const rm=c.kr&&S.roma?`<div style="font-size:15px;color:var(--indigo);letter-spacing:.03em;margin-top:2px">${esc(roman(c.kr))}</div>`:"";

  if(c.deck==="jamo"||c.deck==="batchim"||c.deck==="syllable"||c.deck==="contrast")
    return `<div class="romaji">${esc(c.back)}</div>
      ${c.sub?`<div class="hint kr" style="font-size:17px">${esc(c.sub)}</div>`:""}
      <div class="hint">${esc(c.extra)}</div>${audio}${wrong}`;

  if(c.deck==="word")   /* 正面是韓文，背面給意思＋實際發音 */
    return `<div class="mid" style="font-size:26px">${esc(c.back)}</div>
      ${soundNote}${rm}<div class="hint">${esc(c.extra)}</div>${audio}${wrong}`;

  if(c.deck==="drama"||c.deck==="travel"||c.deck==="busan"||c.deck==="number")  /* 正面中文，背面韓文 */
    return `<div class="mid kr" style="font-size:26px">${esc(c.back)}</div>
      ${soundNote}${rm}
      ${c.sub?`<div class="hint">敬語：<span class="kr" style="font-size:15px">${esc(c.sub)}</span></div>`:""}
      <div class="hint">${esc(c.extra)}</div>${audio}${wrong}`;

  if(c.deck==="listen") /* 正面只有聲音 */
    return `<div class="mid kr" style="font-size:24px">${esc(c.kr)}</div>
      ${soundNote}${rm}
      <div class="mid" style="font-size:19px;margin-top:6px">${esc(c.back)}</div>
      <div class="hint">${esc(c.extra)}</div>${audio}${wrong}`;

  if(c.deck==="dialogue")
    return `<div class="mid kr" style="font-size:25px">${esc(c.back)}</div>
      ${soundNote}${rm}<div class="hint">對方可能回答：<span class="kr">${esc(c.sub.split("｜")[0])}</span><br>${esc(c.sub.split("｜")[1]||"")}</div>
      <div class="hint">${esc(c.extra)}</div>${audio}${wrong}`;

  if(c.deck==="response")
    return `<div class="mid kr" style="font-size:23px">${esc(c.kr)}</div>${soundNote}${rm}
      <div class="mid" style="font-size:18px;margin-top:6px">${esc(c.back)}</div>
      <div class="hint">它是在回答：<span class="kr">${esc(c.sub)}</span></div>${audio}${wrong}`;

  if(c.deck==="reading")
    return `<div class="mid" style="font-size:23px">${esc(c.back)}</div>
      <div class="hint">全文：${esc(c.sub)}</div><div class="hint">${esc(c.extra)}</div>${audio}${wrong}`;

  /* 文法 */
  return `<div class="mid kr" style="font-size:26px">${esc(c.back)}</div>
    ${c.sub?`<div class="hint kr" style="font-size:17px">${esc(c.sub)}</div>`:""}
    <div class="hint">${esc(c.extra)}</div>
    ${c.gram?c.gram.ex.map(e=>`<div style="border-top:1px solid var(--rule);margin-top:12px;padding-top:10px;text-align:left;width:100%">
      ${sentence(e[0],16)}<div style="font-size:12.5px;color:var(--ink2);margin-top:3px">${esc(e[1])}</div></div>`).join(""):""}
    ${wrong}`;
}
function drawStudy(){
  navEl.innerHTML="";
  if(session.i>=session.q.length){
    app.innerHTML=`<div class="study"><div class="face"><div class="mid">끝!</div>
    <div class="hint">完成 ${session.n} 張 · 今日累計 ${S.day.newN+S.day.revN} 張</div></div>
    <button class="cta" id="bk">回到今日</button></div>`;
    document.getElementById("bk").onclick=()=>{session=null;syncNow();render();};return;
  }
  const c=session.q[session.i],isNew=!seen(c.id);
  const teachNow=isNew&&c.gram&&!taught;
  if(isNew&&!curOpts)curOpts=makeOpts(c);
  if(c.audio&&!shown&&!played){played=1;setTimeout(()=>say(c.kr),200);}
  const big=(c.deck==="jamo"||c.deck==="batchim");
  const tip=teachNow?"文法是規則，沒學過猜不出來。先看懂再作答"
    :(shown?"想不出來就按「不會」。評分誠實，排程才會準"

  app.innerHTML=`<div class="study">
  <div class="qbar"><div>${DLABEL[c.deck]}${teachNow?" · 先學":(isNew?" · 新卡":"　複習")}</div>
    <div>${session.i+1} / ${session.q.length}</div></div>
  <div class="face" style="${teachNow?"align-items:stretch;justify-content:flex-start;text-align:left":""}">
    ${teachNow?`<div class="mid kr" style="font-size:22px;margin-bottom:8px">${esc(c.gram.p)}</div>
      <div style="font-size:14px;color:var(--ink2);line-height:1.7">${esc(c.gram.n)}</div>
      ${c.gram.ex.map(e=>`<div style="border-left:2px solid var(--ruleS);padding-left:11px;margin-top:12px">
        ${sentence(e[0],16)}<div style="font-size:12.5px;color:var(--ink2);margin-top:3px">${esc(e[1])}</div></div>`).join("")}`
    :(c.audio&&!shown
      ? `<button class="spk" data-say="${esc(c.kr)}" style="font-size:26px;padding:26px 40px;border-radius:99px">▶</button>
         <button class="spk" data-slow="${esc(c.kr)}" style="margin-top:12px">▶ 放慢再聽</button>`
      : `<div class="${big?"big kr":((c.deck==="gram"||c.deck==="reading")?"small kr":"mid")}" style="white-space:pre-line">${esc(c.front)}</div>`)}
    ${shown?`<div class="ans">${answerBlock(c,isNew,pick)}    </div>`:""}
  </div>
  <div class="tip">${tip}</div>
  ${teachNow?`<button class="reveal" id="taught">懂了，來測驗</button>`
   :(shown?`<div class="grades"><button class="g0" data-g="0">不會</button>
     <button class="g1" data-g="1">模糊</button><button class="g2" data-g="2">會了</button></div>`
   :(session.typed?`<input id="typeans" class="answerInput kr" lang="ko" autocomplete="off" autocapitalize="off" placeholder="請輸入韓文答案">
       <button class="reveal" id="typecheck">檢查答案</button>`
   :(isNew?`<div class="opts">${curOpts.map(o=>`<button data-opt="${esc(o)}" class="kr">${esc(o)}</button>`).join("")}</div>`
     :`<button class="reveal" id="rv">顯示答案</button>`)))}
  <div style="display:flex;gap:8px;margin-top:8px">
    ${undoSnap?`<button class="cta2" id="undo" style="margin:0;flex:1">↶ 上一張</button>`:""}
    <button class="cta2" id="quit" style="margin:0;flex:1">結束這輪</button></div></div>`;
  bind();
  const tg=document.getElementById("taught");
  if(tg)tg.onclick=()=>{taught=true;drawStudy();};
  const rv=document.getElementById("rv");
  if(rv)rv.onclick=()=>{shown=true;drawStudy();if(c.kr)say(c.kr);};
  const tc=document.getElementById("typecheck"),ti=document.getElementById("typeans");
  if(ti)setTimeout(()=>ti.focus(),20);
  if(tc)tc.onclick=()=>{pick=(ti.value||"").trim();if(!pick)return;shown=true;drawStudy();if(c.kr)say(c.kr);};
  if(ti)ti.onkeydown=e=>{if(e.key==="Enter")tc.click();};
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    pick=b.dataset.opt;shown=true;drawStudy();if(c.kr)say(c.kr);});
  app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    const wasNew=!seen(c.id);
    const prev=S.cards[c.id]?JSON.parse(JSON.stringify(S.cards[c.id])):null;
    const snap={id:c.id,prev,wasNew,i:session.i,total:S.total,last:S.last,pick,opts:curOpts};
    const again=grade(c.id,+b.dataset.g);
    if(wasNew)S.day.newN++;else S.day.revN++;
    snap.again=again;if(again)session.q.push(c);
    undoSnap=snap;
    session.i++;shown=false;pick=null;curOpts=null;played=0;taught=false;drawStudy();});
  const ud=document.getElementById("undo");
  if(ud)ud.onclick=()=>{const u=undoSnap;if(!u)return;
    if(u.prev)S.cards[u.id]=u.prev;else delete S.cards[u.id];
    if(u.wasNew)S.day.newN=Math.max(0,S.day.newN-1);else S.day.revN=Math.max(0,S.day.revN-1);
    S.total=u.total;S.last=u.last;
    if(u.again&&session.q[session.q.length-1]&&session.q[session.q.length-1].id===u.id)session.q.pop();
    session.i=u.i;shown=true;pick=u.pick;curOpts=u.opts;played=1;taught=true;
    undoSnap=null;save();drawStudy();};
  document.getElementById("quit").onclick=()=>{session=null;syncNow();render();};
}

loadSync();
load().then(()=>{render();return flush();}).then(()=>{if(!session)render();return syncNow();})
.catch(e=>{const root=document.getElementById("app");if(root){root.innerHTML=`<div class="wrap"><h1>載入失敗</h1><p class="sub" style="color:var(--seal)">${String((e&&e.message)||e).replace(/[&<>]/g,"")}</p><button class="cta" onclick="location.reload()">重新載入</button></div>`;}});
</script>
